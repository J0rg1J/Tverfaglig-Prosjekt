<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tverfaglig Prosjekt</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Egen CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Tverfaglig Prosjekt</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Hjem</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                data-bs-toggle="modal"
                data-bs-target="#authModal"
                >Logg inn</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Brukerveiledning</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      <div id="feedback"></div>
    </div>

    <!-- HOVEDINNHOLD -->
    <main class="container mt-5">
      <h1>Velkommen</h1>
      <p>
        Dette er et skoleprosjekt der jeg bruker HTML, CSS, JavaScript,
        Bootstrap og Supabase.
      </p>

      <h2 class="mt-4">Tilgjengelig vinterutstyr</h2>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <label class="form-label">Kategori</label>
              <select id="filterCategory" class="form-select">
                <option value="">Alle</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label">Tilgjengelighet</label>
              <select id="filterAvailability" class="form-select">
                <option value="all">Alle</option>
                <option value="available">Kun tilgjengelig</option>
                <option value="unavailable">Kun utlånt</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label">Søk</label>
              <input
                id="filterSearch"
                class="form-control"
                placeholder="Søk i navn..."
              />
            </div>
          </div>
        </div>
      </div>

      <div id="messages" class="list-group"></div>
    </main>

    <hr class="my-4" />

    <div id="adminSection" class="d-none">
      <h2>Admin: aktive utlån</h2>
      <div id="activeBookings" class="list-group"></div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center p-3 mt-5">
      <p class="mb-0">© 2026 Tverfaglig Prosjekt</p>
    </footer>

    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Konto</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Lukk"
            ></button>
          </div>

          <div class="modal-body">
            <ul class="nav nav-tabs" id="authTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  data-bs-toggle="tab"
                  data-bs-target="#loginTab"
                  type="button"
                  role="tab"
                >
                  Logg inn
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  data-bs-toggle="tab"
                  data-bs-target="#signupTab"
                  type="button"
                  role="tab"
                >
                  Lag bruker
                </button>
              </li>
            </ul>

            <div class="tab-content pt-3">
              <!-- Logg inn -->
              <div
                class="tab-pane fade show active"
                id="loginTab"
                role="tabpanel"
              >
                <div class="mb-3">
                  <label class="form-label">E-post</label>
                  <input id="loginEmail" type="email" class="form-control" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Passord</label>
                  <input
                    id="loginPassword"
                    type="password"
                    class="form-control"
                  />
                </div>
                <button
                  class="btn btn-primary w-100"
                  onclick="loggInnMedSkjema()"
                >
                  Logg inn
                </button>
              </div>

              <!-- Lag bruker -->
              <div class="tab-pane fade" id="signupTab" role="tabpanel">
                <div class="mb-3">
                  <label class="form-label">E-post</label>
                  <input id="signupEmail" type="email" class="form-control" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Passord</label>
                  <input
                    id="signupPassword"
                    type="password"
                    class="form-control"
                  />
                  <div class="form-text">Minst 6 tegn er vanlig.</div>
                </div>
                <button
                  class="btn btn-success w-100"
                  onclick="lagBrukerMedSkjema()"
                >
                  Lag bruker
                </button>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Lukk
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- EGEN JavaScript-fil -->
    <script src="script.js"></script>
  </body>
</html>
